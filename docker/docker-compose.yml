version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - WORKSPACE_BASE_DIR=/app/workspace
    env_file:
      - ../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # 需要访问 Docker
      - workspace-data:/app/workspace
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  workspace-data:
